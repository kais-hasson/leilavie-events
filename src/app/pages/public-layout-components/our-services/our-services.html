<section class="relative w-full overflow-hidden bg-background px-4 py-10 sm:px-6 sm:py-14">

  <div
    class="pointer-events-none absolute -right-16 top-10 h-56 w-56 rounded-3xl
           bg-secondary/10 lg:h-72 lg:w-72"
  ></div>

  <div
    appScrollReveal
    class="relative z-10 mx-auto flex max-w-6xl flex-col items-center gap-3 text-center"
  >
    <span class="font-app text-xs font-semibold uppercase tracking-[0.3em] text-secondary">
      {{ eyebrow() }}
    </span>
    <h2 class="font-app-header text-3xl text-primary-900 sm:text-4xl lg:text-5xl">
      {{ heading() }}
    </h2>
    <span class="h-1 w-16 rounded-full bg-secondary"></span>
  </div>

  <div class="relative z-10 mx-auto mt-10 grid max-w-6xl grid-cols-2 gap-5 sm:gap-6 lg:grid-cols-4">
    @for (service of services(); track service.title; let index = $index) {
      <div
        appScrollReveal
        class="group flex flex-col gap-3"
        [style.--reveal-delay]="(120 + index * 100) + 'ms'"
      >
        <div
          class="relative aspect-square overflow-hidden rounded-2xl border-2 border-primary-900/10
                 shadow-md transition-all duration-300 group-hover:-translate-y-1 group-hover:shadow-xl"
        >
          <img
            [src]="service.image"
            alt=""
            class="h-full w-full object-cover transition-transform duration-500 group-hover:scale-110"
          />
        </div>

        <p class="font-app text-center text-sm font-medium text-primary-900 sm:text-base">
          {{ service.title }}
        </p>
      </div>
    }
  </div>

</section>
