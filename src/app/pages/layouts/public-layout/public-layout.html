<div class="flex min-h-screen w-full flex-col bg-background bg-gradient-to-r to-primary/5">
<app-header (settingsRequested)="openSettings()"/>

<main
  class="w-full pt-[calc(var(--app-public-header-height,4.5rem)+1.5rem)] font-app text-primary-800 text-app"
  [class.min-h-screen]="navigationMode() === 'single-page'"
>
  @if (navigationMode() === 'single-page') {
    <app-sections />
  } @else {
    <router-outlet />
  }
</main>

<app-footer/>
<app-settings />
</div>
