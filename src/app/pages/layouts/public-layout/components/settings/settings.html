@if (isOpen()) {
  <div
    class="fixed inset-0 z-40 bg-black/30"
    (click)="close()"
  ></div>

  <aside
    class="fixed top-0 right-0 z-50 h-full w-80 bg-background text-ptimary shadow-xl"
  >
    <div class="flex items-center justify-between border-b border-primary-100 p-4">
      <h2 class="text-xl font-semibold">
        Settings
      </h2>

      <button
        type="button"
        class="text-2xl"
        (click)="close()"
        aria-label="Close settings"
      >
        ×
      </button>
    </div>

    <div class="p-4">
      <h3 class="mb-3 font-medium">
        Theme
      </h3>
      <button (click)="setTheme('default')"
              class="bg-[#6B5282] text-[#FAFAFA]"
      >default</button>
      <button (click)="setTheme('second')"
              class="bg-[#7A8B7B] text-[#FAFAFA]"
      >second</button>
      <button (click)="setTheme('third')"
              class="bg-[#FFF9FA] text-[#6B5282]"
      >third</button>

      <!-- Theme options will be added here -->
      <h3 class="mb-3 font-medium">
        Pages style
      </h3>
      <button (click)="setNavigationMode('single-page')"   [class.font-semibold]="navigationMode() === 'single-page'">Single Page</button>
      <button (click)="setNavigationMode('pages')"   [class.font-semibold]="navigationMode() === 'pages'">Pages</button>

    </div>
  </aside>
}
