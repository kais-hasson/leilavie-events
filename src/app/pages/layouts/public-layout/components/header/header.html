<header
  #headerRoot
  class="fixed inset-x-0 top-2 z-30 mx-auto w-[98vw] p-2 flex items-center justify-between
    gap-3 rounded-xl backdrop-blur-xl
    border
    border-white/20 bg-primary/20 font-app text-primary-800 shadow-md

    max-md:h-auto
    max-md:min-h-[8vh]
    max-md:flex-wrap
    max-md:px-3
    max-md:py-2"
>
  <nav class="flex min-w-0 flex-1 items-center text-header justify-center gap-4

              max-md:order-3
              max-md:w-full
              max-md:gap-1
              max-md:justify-between">

    @for (item of headerMenuItems; track item.id; let index=$index) {
        
      @if (navigationMode() === 'single-page') {
@if(headerMenuItems.length/2 ===index) {
          <div class="brand shrink-0 px-3 text-header text-center max-md:flex-1">
              <h1 class="text-primary-900">
                Leilave Events
              </h1>
              <h4 class="text-primary-700/80">
              Sweet sights, Sweet delights.
              </h4>
            </div>
          }
        <a
          [ngClass]="{
            'bg-background/80 text-primary-900 font-semibold border-primary-900/30': activeSection() === item.sectionId,
          }"

          class="flex flex-1 items-center justify-center
         m-3 px-2 py-1
         rounded-xl
         bg-background/20
         backdrop-blur-xl
         border border-primary/20
         hover:bg-background/60
         hover:border-primary-900/30
         shadow-lg
         transition-all duration-200

         max-md:m-1
         max-md:px-1
         max-md:py-1
         max-md:text-sm
         max-md:whitespace-nowrap"

          (click)="setActiveSection(item.sectionId)"
          [href]="'#'+item.sectionId">
          
          {{ item.title }}

        </a>

      } @else {

        <a
          class="flex flex-1 items-center justify-center
         m-3 px-2 py-1
         rounded-xl
         bg-background/20
         backdrop-blur-xl
         border border-primary/20
         hover:bg-background/50
         hover:border-primary-900/30
         shadow-lg
         transition-all duration-200

         max-md:m-1
         max-md:px-1
         max-md:py-1
         max-md:text-sm
         max-md:whitespace-nowrap"

          [ngClass]="{
            'bg-background/80 text-primary-900 font-semibold border-primary-900/30': activeSection() === item.sectionId,
          }"

          routerLinkActive="active"
          (click)="setActiveSection(item.sectionId)"
          [routerLink]="item.route">

          {{ item.title }}

        </a>

      }

    }

  </nav>

  <div class="actions shrink-0">
    <button
      type="button"
      (click)="openSettings()"
      aria-label="Open settings"
      class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl
             border border-primary/20 bg-background/20 text-lg shadow-md
             backdrop-blur-xl transition-all duration-200
             hover:scale-110 hover:bg-background/50"
    >
      ⚙️
    </button>
  </div>

</header>
