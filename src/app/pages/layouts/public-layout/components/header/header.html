<header class="h-[8vh] w-[99vh] fixed w-full top-2 z-30 p-2 my-1 mx-2 self-center flex items-center justify-between rounded-xl backdrop-blur-xl
    border
    border-white/20 bg-primary/20 font-app text-primary-800 shadow-md">
  <div class="brand text-header">
    <h1>
      Leilave Events
    </h1>
  </div>
  <nav class="w-[50vw] flex items-center text-header justify-center gap-4">
    @for (item of headerMenuItems; track item.id) {
      @if (navigationMode() === 'single-page') {
        <a
          [ngClass]="{
    'bg-background/80 text-primary border-primary-900/30': activeSection() === item.sectionId,
  }"
          class="flex flex-1 items-center justify-center
         m-3 px-2 py-1
         rounded-xl
         bg-background/20
         backdrop-blur-xl
         border border-primary/20
          hover:bg-background/60
         hover:border-primary-900/30
         shadow-lg
         transition-all duration-200" (click)="setActiveSection(item.sectionId)"
          [href]="'#'+item.sectionId">{{ item.title }}</a>
      } @else {
        <a class="flex flex-1 items-center justify-center
         m-3 px-2 py-1
         rounded-xl
         bg-background/20
         backdrop-blur-xl
         border border-primary/20
          hover:bg-background/50
         hover:border-primary-900/30
         shadow-lg
         transition-all duration-200" [ngClass]="{
    'bg-background/80 text-primary border-primary-900/30': activeSection() === item.sectionId,
  }" routerLinkActive="active"
           (click)="setActiveSection(item.sectionId)"
           [routerLink]="item.route">{{ item.title }}</a>
      }
    }
  </nav>
  <div class="actions">
    <button
      type="button"
      (click)="openSettings()"
      aria-label="Open settings"
    >
      ⚙️
    </button>
  </div>
</header>
