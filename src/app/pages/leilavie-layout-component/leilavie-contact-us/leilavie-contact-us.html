<section class="flex h-full w-full items-center justify-center overflow-hidden">
<div
  class="relative mx-3 my-6 flex max-h-full w-[calc(100%-1.5rem)] flex-col items-center gap-8
         overflow-hidden rounded-[2rem] border border-primary/10
         bg-gradient-to-br from-primary/20 via-background/60 to-secondary/15
         px-4 py-8 text-center shadow-2xl shadow-primary/10 backdrop-blur-xl
         sm:px-6 sm:py-10 lg:flex-row lg:items-center lg:justify-between
         lg:px-14 lg:text-left"
>
 
  <div
    class="pointer-events-none absolute -left-10 -top-10 z-0 h-2/3 w-1/2
           rounded-[2rem] bg-gradient-to-br from-primary/40 to-transparent
           opacity-60 blur-3xl">
  </div> 

  <div
    class="pointer-events-none absolute -bottom-10 -right-10 z-0 h-2/3 w-1/2
           rounded-[2rem] bg-gradient-to-tl from-secondary/40 to-transparent
           opacity-60 blur-3xl">
  </div>

  <div class="relative z-10 flex flex-col items-center gap-3 lg:items-start">
    <span
      appScrollReveal
      class="font-app text-xs font-semibold uppercase
             tracking-[0.3em] text-secondary/70 sm:text-sm"
      style="--reveal-delay: 60ms"
    >
      Let's Create Something Beautiful
    </span>

    <h2
      appScrollReveal
      class="font-app-header text-3xl text-primary-900 sm:text-4xl"
      style="--reveal-delay: 140ms"
    >
      Ready to Plan Your Event?
    </h2>

    <a
      appScrollReveal
      href="https://wa.me/message/CKNSL7C5D5QYJ1"
      class="group font-app mt-2 inline-flex items-center
             gap-2 rounded-full bg-gradient-to-r from-secondary via-secondary
             to-primary-700 px-7 py-3 text-xs font-semibold uppercase
             tracking-wider text-text-button shadow-lg shadow-secondary/20
             backdrop-blur-xl transition-all duration-200
             hover:scale-105 hover:shadow-xl hover:shadow-secondary/30"
      style="--reveal-delay: 220ms"
    >
      Get in Touch
      <span class="transition-transform duration-200 group-hover:translate-x-1" aria-hidden="true">→</span>
    </a>
  </div>

  <div
    appScrollReveal
    class="relative z-10 flex flex-col items-center gap-4 lg:items-end"
    style="--reveal-delay: 300ms"
  >
    <div class="flex items-center gap-5">
      <a
        href="https://www.instagram.com/leilavie.events?stkn=bTI0aWtuNWJkNml0"
        aria-label="Leilavie on Instagram"
        class="flex items-center justify-center rounded-full border
               border-primary/20 bg-gradient-to-br from-primary/30
               via-background/40 to-secondary/20 p-2 text-primary-900
               shadow-sm backdrop-blur-xl transition-all duration-200
               hover:-translate-y-1 hover:scale-110 hover:shadow-md"
      >
        <app-icon name="instagram" size="sm" />
      </a>

      <a
        href="https://wa.me/message/CKNSL7C5D5QYJ1"
        aria-label="Leilavie on WhatsApp"
        class="flex items-center justify-center rounded-full border
               border-primary/20 bg-gradient-to-br from-secondary/30
               via-background/40 to-primary/20 p-2 text-primary-900
               shadow-sm backdrop-blur-xl transition-all duration-200
               hover:-translate-y-1 hover:scale-110 hover:shadow-md"
      >
        <app-icon name="whatsapp" size="sm" />
      </a>

      <a
        href="#"
        aria-label="Leilavie on Facebook"
        class="flex items-center justify-center rounded-full border
               border-primary/20 bg-gradient-to-br from-primary/30
               via-background/40 to-secondary/20 p-2 text-primary-900
               shadow-sm backdrop-blur-xl transition-all duration-200
               hover:-translate-y-1 hover:scale-110 hover:shadow-md"
      >
        <app-icon name="facebook" size="sm" />
      </a>
    </div>

    <p class="font-app-secondary text-xl text-secondary sm:text-2xl">
      Sweet sights, sweet delights ♡
    </p>
  </div>

</div>
</section>
