<section class="relative flex h-full w-full flex-col justify-center overflow-hidden bg-background px-4 py-6 sm:px-6 sm:py-10">

  <div
    class="relative z-10 mx-auto flex max-w-6xl flex-col items-center gap-10
           lg:flex-row lg:gap-16"
  >

    <!-- TEXT -->
    <div class="flex w-full flex-col items-center gap-5 text-center lg:w-1/2 lg:items-start lg:text-left">
      <span
        appScrollReveal
        class="font-app text-xs font-semibold uppercase tracking-[0.3em] text-secondary/70 sm:text-sm"
        style="--reveal-delay: 60ms"
      >
        {{ eyebrow() }}
      </span>

      <h1
        appScrollReveal
        class="font-app-header text-3xl leading-[1.15] text-primary-900 sm:text-4xl lg:text-5xl"
        style="--reveal-delay: 160ms"
      >
        @for (line of heading(); track line) {
          <span class="block">{{ line }}</span>
        }
      </h1>

      <p
        appScrollReveal
        class="font-app max-w-md text-sm leading-relaxed text-secondary/80 sm:text-base"
        style="--reveal-delay: 260ms"
      >
        {{ description() }}
      </p>

      <a
        appScrollReveal
        routerLink="/contact-us"
        class="group font-app mt-2 inline-flex items-center gap-2 rounded-full
               bg-gradient-to-r from-secondary via-secondary to-primary-700
               px-7 py-3 text-xs font-semibold uppercase
               tracking-wider text-text-button shadow-lg shadow-secondary/20
               backdrop-blur-xl transition-all duration-200
               hover:scale-105 hover:shadow-xl hover:shadow-secondary/30"
        style="--reveal-delay: 360ms"
      >
        Get in Touch
        <span class="transition-transform duration-200 group-hover:translate-x-1" aria-hidden="true">→</span>
      </a>
    </div>

    <!-- IMAGE -->
    <div
      appScrollReveal
      class="reveal-scale group relative w-full max-w-md lg:w-1/2"
      style="--reveal-delay: 200ms"
    >
      <div
        class="pointer-events-none absolute -right-6 -top-6 h-2/3 w-2/3
               rounded-[2rem] bg-gradient-to-br from-primary/40 to-transparent
               blur-3xl">
      </div>

      <div
        class="relative aspect-[4/5] max-h-[38vh] overflow-hidden rounded-[2rem]
               border border-white/40 shadow-2xl shadow-primary/10
               transition-all duration-300
               group-hover:-translate-y-1 group-hover:shadow-secondary/20"
      >
        <img
          src="/assets/img/li.jpg"
          alt="Leilavie event styling"
          class="h-full w-full object-cover transition-transform duration-500
                 group-hover:scale-105"
        >
      </div>
    </div>

  </div>

</section>
