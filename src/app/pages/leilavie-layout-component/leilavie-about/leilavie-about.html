<section class="relative flex h-full w-full flex-col justify-center overflow-hidden bg-background px-4 py-6 sm:px-6 sm:py-10">

  <div
    class="pointer-events-none absolute -right-16 top-1/4 z-0 h-[30vh] w-[45vw]
           rounded-[2rem] bg-gradient-to-bl from-secondary/30 to-transparent
           opacity-60 blur-3xl
           lg:-right-[4vw] lg:h-[40vh] lg:w-[22vw]">
  </div>

  <div
    class="relative z-10 mx-auto flex max-w-6xl flex-col items-center gap-10
           lg:flex-row lg:gap-16"
  >

    <!-- IMAGE -->
    <div
      appScrollReveal
      class="group relative w-full max-w-md lg:w-1/2"
      style="--reveal-delay: 80ms"
    >
      <div
        class="pointer-events-none absolute -left-6 -top-6 h-2/3 w-2/3
               rounded-[2rem] bg-gradient-to-br from-primary/40 via-secondary/15 to-transparent
               blur-3xl">
      </div>

      <div
        class="relative aspect-[4/5] overflow-hidden rounded-[2rem]
               border border-white/40 shadow-2xl shadow-primary/10
               transition-all duration-300
               group-hover:-translate-y-1 group-hover:shadow-secondary/20"
      >
        <img
          src="/assets/img/li.jpg"
          alt="Leilavie floral arrangement"
          class="h-full w-full object-cover transition-transform duration-500
                 group-hover:scale-105"
        >
      </div>
    </div>

    <!-- TEXT -->
    <div class="flex w-full flex-col items-center gap-5 text-center lg:w-1/2 lg:items-start lg:text-left">
      <span
        appScrollReveal
        class="font-app text-xs font-semibold uppercase
               tracking-[0.3em] text-secondary/70 sm:text-sm"
        style="--reveal-delay: 160ms"
      >
        {{ eyebrow() }}
      </span>

      <h2
        appScrollReveal
        class="font-app-header text-3xl leading-[1.15]
               text-primary-900 sm:text-4xl lg:text-5xl"
        style="--reveal-delay: 240ms"
      >
        @for (line of heading(); track line) {
          <span class="block">{{ line }}</span>
        }
      </h2>

      <p
        appScrollReveal
        class="font-app max-w-md text-sm leading-relaxed
               text-secondary/80 sm:text-base"
        style="--reveal-delay: 320ms"
      >
        {{ description() }}
      </p>

      <p
        appScrollReveal
        class="font-app-secondary text-2xl text-secondary sm:text-3xl"
        style="--reveal-delay: 400ms"
      >
        {{ tagline() }}
      </p>

      <a
        appScrollReveal
        routerLink="/our-services"
        class="font-app mt-2 inline-flex items-center gap-2
               rounded-full border border-primary/30 bg-gradient-to-r
               from-primary/30 via-background/40 to-secondary/20 px-7 py-3
               text-xs font-semibold uppercase tracking-wider text-secondary
               shadow-md backdrop-blur-xl transition-all duration-200
               hover:scale-105 hover:shadow-lg hover:shadow-secondary/10"
        style="--reveal-delay: 480ms"
      >
        Learn More
      </a>
    </div>

  </div>

</section>
