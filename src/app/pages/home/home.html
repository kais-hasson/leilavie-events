<div class="bg-secondary/10 m-10 p-10 text-header font-bold  flex flex-col items-start ">
  <header>
    <p  class="text-[calc(var(--app-header-font-size)+2rem)]">
      Leilavie
    </p>
    <p>
    Sweet sights, Sweet delights.
    </p>
  </header>
  <main class="flex flex-col gap-2 items-start w-full">
    <div class="flex justify-between h-[76vh] w-full " >
      <div class="self start px-2 mx-2  bg-gradient-to-t
         from-primary/30
         via-background/40
         rounded-full
         ">
        <div class="bg-[url('/assets/logos/gemini-svg.svg')] shadow-xl bg-cover bg-center bg-no-repeat h-50 w-50 border rounded-full border-primary" >
      </div>
      </div>
      <div  class="self-end">
        <img src="assets/img/li.jpg"  class="h-110 w-60 shadow-xl p-5 border border-primary bg-secondary/30 backdrop-blur-xl rounded-[30vh] backdrop-blur-xl"/>
      </div>
      <div  class="self-center">
        <img src="assets/img/li.jpg"  class="h-125 w-75 shadow-xl p-5 border border-primary bg-secondary/30 backdrop-blur-xl rounded-[30vh] backdrop-blur-xl"/>
      </div>
      <div  class="self-start">
        <img src="assets/img/li.jpg"  class="h-110 w-60 shadow-xl p-5 border border-primary bg-secondary/30 backdrop-blur-xl rounded-[30vh] backdrop-blur-xl"/>
      </div>
      <div class="self-start  m-8 bg-gradient-to-t
         from-primary/30
         via-background/40">
        <p class="font-app text-primary rounded-2xl
         border border-primary/20
         bg-gradient-to-r
         from-primary/20
         via-background/40
         to-primary/10
         px-6 py-3
         backdrop-blur-xl
         shadow-lg w-fit">
          @for (line of text().split('\n'); track $index) {
            <span class="block">{{ line }}</span>
          }
        </p>
      </div>
    </div>
  </main>
</div>
